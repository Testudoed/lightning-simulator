# Copy to ~/.config/lightning-simulator/config.toml on the Pi.
[trigger]
mode = "motion" # motion, hold, toggle; exactly one input is requested
warmup_seconds = 60.0 # PIR only; inactive input required before arming
# Button levels must remain stable for this long before changing state.
debounce_ms = 50.0

[pins]
chip = "/dev/gpiochip0" # Confirm the BCM GPIO chip with gpioinfo on your Pi 4.
led = 10 # SPI0 MOSI, physical 19; fixed for this backend
pir = 17 # physical 11, active high
button = 27 # physical 13, button to ground, internal pull-up
relay = 23 # physical 16, active-high 3.3 V compatible relay MODULE

[leds]
count = 120
brightness = 255 # 0..255; use this same value for the compatibility spike
color_order = "GRB"

[effect]
flashes = 3
animation = "travel" # Grow a dim path, flash the whole strip at the bottom, then off
direction = "forward" # First LED at the top; use "reverse" if the last LED is at the top
travel_seconds = 0.15 # Time for the path to reach the bottom
bolt_width = 12 # Number of new pixels illuminated per growth step
leader_brightness = 0.25 # Path brightness relative to the full-brightness flash (0.01..1)
# Full-brightness flash duration after reaching the bottom (also used by animation="flash").
flash_min = 0.05
flash_max = 0.2
# Dark pause before the next strike, for either animation.
gap_min = 0.05
gap_max = 0.3

[audio]
enabled = true
background = "resource:background_storm.mp3"
thunder = "resource:lightning_strike.wav"
# Custom paths are relative to this TOML file. Background streams continuously.
background_volume = 0.35
thunder_volume = 0.65
sink = "lightning_mix" # Must match the PipeWire drop-in.
speaker_address = "" # Commission with your A2DP speaker's XX:XX:XX:XX:XX:XX address.
reconnect_seconds = 5.0
command_timeout = 3.0

[prop]
enabled = false # Enable only after the relay is installed and tested.
