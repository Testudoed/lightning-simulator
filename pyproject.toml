[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lightning-simulator"
dynamic = ["version"]
description = 'Raspberry Pi 4 lightning, thunder and prop controller'
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
keywords = []
authors = [
  { name = "Kyle Roberts", email = "kylearobertsdev@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "click>=8.1,<9",
]

[project.optional-dependencies]
pi = ["gpiod>=2.2,<3", "rpi-ws281x>=5.0,<6", "pygame>=2.6.1,<3"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
lightning-simulator = "lightning_simulator.cli:lightning_simulator"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.2.0"

[tool.hatch.build.targets.wheel]
packages = ["src/lightning_simulator"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "deploy", "docs", "config.example.toml", ".python-version", "uv.lock", "lightning_simulation.service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.hooks.vcs]
version-file = "src/lightning_simulator/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/lightning_simulator tests}"

[tool.coverage.run]
source_pkgs = ["lightning_simulator", "tests"]
branch = true
parallel = true
omit = [
  "src/lightning_simulator/__about__.py",
]

[tool.coverage.paths]
lightning_simulator = ["src/lightning_simulator", "*/lightning-simulator/src/lightning_simulator"]
tests = ["tests", "*/lightning-simulator/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
