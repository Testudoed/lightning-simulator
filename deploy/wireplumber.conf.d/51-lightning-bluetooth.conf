# WirePlumber 0.5 (Debian 13 Trixie); dedicated headless user pi.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
# Use stereo A2DP audio; do not switch this installation to headset profiles.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
}
