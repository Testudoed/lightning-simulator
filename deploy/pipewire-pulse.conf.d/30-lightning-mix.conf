# Install in pi's ~/.config/pipewire/pipewire-pulse.conf.d/.
# Always present, even if Bluetooth is absent; consumes the ongoing mixed stream.
pulse.cmd = [
  { cmd = "load-module"
    args = "module-null-sink sink_name=lightning_mix channels=2 channel_map=front-left,front-right sink_properties=device.description=LightningMix"
    flags = [ ]
  }
]
